packages:
  darwin:
    brews:
      - "git"
      - "git-gui"
      - "gh"
      - "n"
      - "uv"
      - "neovim"
      - "fastfetch"
      - "tmux"
      - "curl"
      - "lazygit"
      - "tree-sitter-cli"
      - "fzf"
      - "ripgrep"
      - "fd"
      - "devcontainer"
      - "tree"
      - "wireguard-tools"
      - "aws-vault"
      - "lima"
      - "colima"
      - "docker"
      - "docker-compose"
      - "docker-credential-helper"
      - "docker-buildx"
      - "k3d"
      - "coreutils"
    casks:
      - "font-commit-mono-nerd-font"
      - "font-meslo-lg-nerd-font"
      - "grandperspective"
      - "meld"
      - "swiftbar"
    unattended_install:
      - command:
          - curl -s https://sdk.cloud.google.com > install.sh
          - if [ ! -d ~/google-cloud-sdk ]; then bash install.sh --disable-prompts; fi
          - mkdir -p ~/.docker/cli-plugins
          - ln -sf $(brew --prefix)/bin/docker-buildx ~/.docker/cli-plugins/docker-buildx
      - command:
          - if ! brew tap | grep -q hashicorp/tap; then brew tap hashicorp/tap; fi
          - if ! brew list hashicorp/tap/packer >/dev/null 2>&1; then brew install hashicorp/tap/packer; fi
  linux:
    apt_packages:
      - git
      - git-gui
      - gh
      - tmux
      - curl
      - fzf
      - ripgrep
      - fd-find
      - python3
      - luarocks
      - shellcheck
    node_install:
      version: "lts" # or "latest", or a specific version like "22.11.0"
      packages:
        - tree-sitter-cli
        - wrangler
    deb_install_packages: []
    appimage_install_packages: []
    unattended_install:
      - command:
          - curl -LsSf https://astral.sh/uv/install.sh | sh
      - command:
          - curl -s https://sdk.cloud.google.com > install.sh
          - if [ ! -d ~/google-cloud-sdk ]; then bash install.sh --disable-prompts >/dev/null 2>&1; fi
      - command:
          - if ! command -v pnpm >/dev/null 2>&1; then curl -fsSL https://get.pnpm.io/install.sh | sh -; fi
      - command:
          - if ! command -v claude >/dev/null 2>&1; then curl -fsSL https://claude.ai/install.sh | bash; fi
      - command:
          - wget -O - https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          - echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(grep -oP '(?<=UBUNTU_CODENAME=).*' /etc/os-release || lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          - sudo apt update && sudo apt install -y packer terraform
      - command:
          - bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) latest /usr/local/bin
    tar_install_packages:
      - url: "https://github.com/fastfetch-cli/fastfetch/releases/latest/download/fastfetch-linux-aarch64.tar.gz"
        file: "fastfetch.tar.gz"
        target: "/opt/fastfetch"
        binary: "/usr/bin/fastfetch"
        symlink: "/usr/local/bin/fastfetch"
      - url: "https://github.com/neovim/neovim/releases/download/stable/nvim-linux-arm64.tar.gz"
        file: "nvim.tar.gz"
        target: "/opt/nvim"
        binary: "/bin/nvim"
        symlink: "/usr/local/bin/nvim"
      - url: "https://go.dev/dl/go1.26.0.linux-arm64.tar.gz"
        file: "go.tar.gz"
        target: "/opt/go"
        binary: "/bin/go"
        symlink: "/usr/bin/go"
